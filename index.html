<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Margine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF5E7;
    --paper-shadow: rgba(80, 65, 30, 0.10);
    --rule-line: rgba(70, 100, 155, 0.15);
    --margin-line: rgba(199, 68, 68, 0.5);

    --ink: #29334A;
    --ink-strong: #1B2233;
    --ink-dim: #756D5B;
    --ink-faint: #B9AF97;

    --glass-fill: rgba(255, 255, 255, 0.46);
    --glass-fill-strong: rgba(255, 255, 255, 0.68);
    --glass-border: rgba(255, 255, 255, 0.85);
    --glass-shadow: 0 10px 30px rgba(70, 55, 25, 0.14);
    --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.75);

    --card-mustard: #E7B44A;
    --card-teal: #5C9186;
    --card-rose: #D98098;
    --card-denim: #6C8FB8;
    --card-plum: #9A7CAE;
    --ink-on-card: #241D10;

    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;

    --radius-card: 18px;
    --radius-glass: 22px;
    --radius-pill: 999px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    color: var(--ink);
    font-family: var(--font-body);
    height: 100%;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    background-color: var(--paper);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 30px,
      var(--rule-line) 30px,
      var(--rule-line) 31px
    );
    background-position: 0 92px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }

  input, textarea {
    font-family: inherit;
    color: inherit;
    background: none;
    border: none;
    outline: none;
  }

  ::selection { background: var(--card-mustard); color: var(--ink-on-card); }
  a { color: inherit; }

  /* ---------- Glass ---------- */

  .glass {
    background: var(--glass-fill);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow), var(--glass-highlight);
  }

  /* ---------- Layout shells ---------- */

  #app { height: 100vh; height: 100dvh; overflow: hidden; position: relative; }

  .view { position: absolute; inset: 0; display: none; }
  .view.active { display: flex; flex-direction: column; }

  /* ---------- Auth view ---------- */

  #auth-view { align-items: center; justify-content: center; padding: 24px; }

  .auth-box {
    width: 100%;
    max-width: 360px;
    text-align: left;
    padding: 34px 30px;
    border-radius: 28px;
  }

  .auth-wordmark {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 500;
    color: var(--ink-strong);
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    border-left: 3px solid var(--margin-line);
    padding-left: 14px;
  }

  .auth-tag { color: var(--ink-dim); font-size: 13.5px; margin: 10px 0 28px 17px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 6px; }

  .field input {
    width: 100%;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 15px;
  }
  .field input:focus { border-color: var(--card-denim); }

  .btn-primary {
    width: 100%;
    background: rgba(231, 180, 74, 0.55);
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.85);
    box-shadow: 0 6px 18px rgba(180, 130, 30, 0.22), inset 0 1px 0 rgba(255,255,255,0.8);
    color: var(--ink-on-card);
    border-radius: var(--radius-pill);
    padding: 13px 14px;
    font-size: 15px;
    font-weight: 600;
    margin-top: 6px;
  }
  .btn-primary:active { transform: scale(0.98); }

  .auth-switch { margin-top: 18px; font-size: 13.5px; color: var(--ink-dim); }
  .auth-switch button { color: var(--ink-strong); text-decoration: underline; text-underline-offset: 2px; }

  .auth-error { color: #B23B4E; font-size: 13px; margin: -4px 0 14px; min-height: 1em; }

  /* ---------- List view ---------- */

  #list-view { padding: 0; }

  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 24px 16px;
    flex-shrink: 0;
  }

  .list-wordmark {
    font-family: var(--font-display);
    font-size: 25px;
    font-weight: 500;
    color: var(--ink-strong);
    border-left: 3px solid var(--margin-line);
    padding-left: 12px;
  }

  .header-right { display: flex; align-items: center; gap: 10px; }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
  }
  .icon-btn:hover { background: rgba(255,255,255,0.5); }
  .icon-btn svg { width: 17px; height: 17px; }

  .search-row { padding: 0 24px 14px; flex-shrink: 0; }

  .search-box {
    display: flex;
    align-items: center;
    gap: 9px;
    border-radius: var(--radius-pill);
    padding: 11px 16px;
  }
  .search-box svg { width: 15px; height: 15px; color: var(--ink-dim); flex-shrink: 0; }
  .search-box input { flex: 1; font-size: 14.5px; }
  .search-box input::placeholder { color: var(--ink-faint); }

  .chips-row {
    display: flex;
    gap: 8px;
    padding: 0 24px 18px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  .chips-row::-webkit-scrollbar { display: none; }

  .chip {
    flex-shrink: 0;
    padding: 7px 15px;
    border-radius: var(--radius-pill);
    background: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.7);
    font-size: 13px;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .chip.active {
    background: var(--ink-strong);
    color: var(--paper);
    border-color: var(--ink-strong);
    font-weight: 600;
  }

  .cards-scroll { flex: 1; overflow-y: auto; padding: 4px 24px 110px; }

  .cards-grid { columns: 2; column-gap: 13px; }
  @media (min-width: 640px) { .cards-grid { columns: 3; } }
  @media (min-width: 960px) { .cards-grid { columns: 4; } }

  .note-card {
    break-inside: avoid;
    margin-bottom: 13px;
    border-radius: var(--radius-card);
    padding: 18px 16px;
    color: var(--ink-on-card);
    display: block;
    width: 100%;
    text-align: left;
    position: relative;
    min-height: 108px;
    box-shadow: 0 6px 16px var(--paper-shadow), inset 0 1px 0 rgba(255,255,255,0.45);
  }
  .note-card::after {
    content: "";
    position: absolute;
    top: 0; right: 0;
    width: 16px; height: 16px;
    background: rgba(0,0,0,0.08);
    border-radius: 0 var(--radius-card) 0 10px;
  }
  .note-card:active { transform: scale(0.98); }

  .note-card .card-subject { font-size: 11.5px; font-weight: 600; opacity: 0.65; margin-bottom: 8px; }
  .note-card .card-title {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.18;
    margin-bottom: 8px;
  }
  .note-card .card-excerpt {
    font-size: 12.5px;
    line-height: 1.4;
    opacity: 0.72;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .note-card .card-date { font-size: 11px; opacity: 0.58; margin-top: 10px; }

  .empty-state { padding: 60px 20px; text-align: center; color: var(--ink-faint); }
  .empty-state p { font-size: 14px; max-width: 240px; margin: 8px auto 0; }

  .fab {
    position: absolute;
    right: 24px;
    bottom: 28px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: rgba(231, 180, 74, 0.55);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.85);
    color: var(--ink-on-card);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 26px rgba(150, 105, 20, 0.28), inset 0 1px 0 rgba(255,255,255,0.85);
  }
  .fab:active { transform: scale(0.94); }
  .fab svg { width: 24px; height: 24px; }

  /* ---------- Editor view ---------- */

  #editor-view { position: relative; }

  .margin-rule {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 46px;
    width: 1px;
    background: var(--margin-line);
    z-index: 0;
    pointer-events: none;
  }

  .editor-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    margin: 10px 12px 0;
    border-radius: var(--radius-glass);
    flex-shrink: 0;
    z-index: 2;
    position: relative;
  }

  .editor-topbar-right { display: flex; gap: 4px; align-items: center; }

  .save-indicator { font-size: 11.5px; color: var(--ink-dim); margin-right: 2px; min-width: 66px; text-align: right; }

  .color-dots {
    display: flex;
    gap: 8px;
    padding: 8px 14px;
    margin: 12px 12px 0;
    width: fit-content;
    border-radius: var(--radius-pill);
    position: relative;
    z-index: 2;
  }
  .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; }
  .color-dot.active { border-color: var(--ink-strong); }

  .editor-scroll { flex: 1; overflow-y: auto; padding: 22px 24px 150px 56px; position: relative; z-index: 1; }

  .subject-input { font-size: 13px; color: var(--ink-dim); font-weight: 500; width: 100%; margin-bottom: 6px; }
  .subject-input::placeholder { color: var(--ink-faint); }

  .title-input {
    font-family: var(--font-display);
    font-size: 29px;
    font-weight: 500;
    color: var(--ink-strong);
    line-height: 1.18;
    width: 100%;
    resize: none;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .title-input::placeholder { color: var(--ink-faint); }

  #body-editor { font-size: 16px; line-height: 30px; outline: none; min-height: 200px; color: var(--ink); }
  #body-editor:empty::before { content: attr(data-placeholder); color: var(--ink-faint); }
  #body-editor p { margin: 0 0 0px; text-align: justify; }
  #body-editor .block-heading { font-weight: 600; font-size: 15px; color: var(--ink-strong); }
  #body-editor ul { margin: 0; padding-left: 22px; }
  #body-editor li { line-height: 30px; }
  #body-editor strong { font-weight: 600; color: var(--ink-strong); }
  #body-editor em { font-style: italic; }

  .editor-toolbar {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: flex;
    gap: 2px;
    padding: 7px;
    border-radius: var(--radius-pill);
    z-index: 3;
  }
  .editor-toolbar .icon-btn { width: 40px; height: 40px; }
  .editor-toolbar .icon-btn:hover { background: rgba(255,255,255,0.55); }

  /* ---------- Version sheet ---------- */

  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(40, 35, 20, 0.28);
    display: none;
    align-items: flex-end;
    z-index: 50;
  }
  .sheet-backdrop.active { display: flex; }

  .sheet {
    background: rgba(250, 245, 231, 0.86);
    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.7);
    width: 100%;
    border-radius: 26px 26px 0 0;
    padding: 20px 20px 28px;
    max-height: 70vh;
    overflow-y: auto;
  }

  .sheet h3 { font-family: var(--font-display); font-weight: 500; font-size: 20px; color: var(--ink-strong); margin: 0 0 16px; }

  .version-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 4px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .version-item:last-child { border-bottom: none; }
  .version-item .v-label { font-size: 14.5px; color: var(--ink-strong); }
  .version-item .v-sub { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }

  .version-restore { font-size: 13px; font-weight: 600; color: #B4780C; padding: 6px 12px; }

  .sheet-close { display: block; width: 100%; text-align: center; padding: 12px; margin-top: 8px; color: var(--ink-dim); font-size: 14px; }

  /* ---------- Toast ---------- */

  #toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30, 25, 15, 0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--paper);
    padding: 10px 18px;
    border-radius: var(--radius-pill);
    font-size: 13.5px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Account view ---------- */

  .account-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 26px 24px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .account-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 27px;
    font-weight: 500;
    color: var(--ink-strong);
    background: rgba(231, 180, 74, 0.4);
    margin-bottom: 14px;
  }

  .account-email { font-size: 16px; font-weight: 600; color: var(--ink-strong); margin: 0 0 4px; }
  .account-meta { font-size: 13px; color: var(--ink-dim); margin: 0 0 28px; }

  .account-card {
    width: 100%;
    max-width: 360px;
    text-align: left;
    padding: 22px;
    border-radius: 22px;
    margin-bottom: 22px;
  }
  .account-card h4 { font-family: var(--font-display); font-weight: 500; font-size: 16px; color: var(--ink-strong); margin: 0 0 14px; }

  .account-msg { font-size: 12.5px; margin-bottom: 10px; min-height: 1em; }
  .account-msg.error { color: #B23B4E; }
  .account-msg.success { color: #3B7A4E; }

  .account-action {
    width: 100%;
    max-width: 360px;
    padding: 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.7);
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink-strong);
    margin-bottom: 10px;
  }
  .account-action:active { transform: scale(0.98); }
  .account-action.danger { color: #B23B4E; }
</style>
</head>
<body>

<div id="app">

  <!-- AUTH -->
  <div id="auth-view" class="view active">
    <div class="auth-box glass">
      <p class="auth-wordmark">Margine</p>
      <p class="auth-tag" id="auth-tagline">Accedi per ritrovare i tuoi appunti su ogni dispositivo.</p>

      <div class="auth-error" id="auth-error"></div>

      <form id="auth-form">
        <div class="field">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" autocomplete="current-password" required minlength="6">
        </div>
        <button type="submit" class="btn-primary" id="auth-submit">Accedi</button>
      </form>

      <p class="auth-switch">
        <span id="auth-switch-text">Non hai un account?</span>
        <button type="button" id="auth-switch-btn">Registrati</button>
      </p>
    </div>
  </div>

  <!-- LIST -->
  <div id="list-view" class="view">
    <div class="list-header">
      <p class="list-wordmark">Margine</p>
      <div class="header-right">
        <button class="icon-btn glass" id="account-btn" title="Account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
      </div>
    </div>

    <div class="search-row">
      <div class="search-box glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Cerca per titolo o materia">
      </div>
    </div>

    <div class="chips-row" id="chips-row">
      <button class="chip active" data-subject="">Tutti</button>
    </div>

    <div class="cards-scroll">
      <div class="cards-grid" id="cards-grid"></div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <p>Ancora nessun appunto. Tocca + per iniziare la prima lezione.</p>
      </div>
    </div>

    <button class="fab" id="new-note-btn" title="Nuovo appunto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <!-- EDITOR -->
  <div id="editor-view" class="view">
    <div class="margin-rule"></div>

    <div class="editor-topbar glass">
      <button class="icon-btn" id="back-btn" title="Indietro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="editor-topbar-right">
        <span class="save-indicator" id="save-indicator"></span>
        <button class="icon-btn" id="history-btn" title="Cronologia versioni">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button class="icon-btn" id="print-btn" title="Stampa / Esporta PDF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>
        <button class="icon-btn" id="delete-btn" title="Elimina">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>
    </div>

    <div class="color-dots glass" id="color-dots"></div>

    <div class="editor-scroll">
      <input type="text" class="subject-input" id="subject-input" placeholder="Materia (facoltativo)">
      <textarea class="title-input" id="title-input" placeholder="Titolo della lezione" rows="1"></textarea>
      <div id="body-editor" contenteditable="true" data-placeholder="Scrivi qui. Vai a capo per formattare: “- ” per gli elenchi, una riga breve che finisce con “:” per i sotto-titoli, **grassetto** e *corsivo*."></div>
    </div>

    <div class="editor-toolbar glass">
      <button class="icon-btn" id="bold-btn" title="Grassetto"><strong style="font-family: var(--font-display); font-size:16px;">B</strong></button>
      <button class="icon-btn" id="italic-btn" title="Corsivo"><em style="font-family: var(--font-display); font-size:16px;">i</em></button>
      <button class="icon-btn" id="list-btn" title="Elenco puntato">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      </button>
    </div>
  </div>

  <!-- ACCOUNT -->
  <div id="account-view" class="view">
    <div class="editor-topbar glass">
      <button class="icon-btn" id="account-back-btn" title="Indietro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="width:38px;"></div>
    </div>

    <div class="account-scroll">
      <div class="account-avatar glass" id="account-avatar"></div>
      <p class="account-email" id="account-email"></p>
      <p class="account-meta" id="account-meta"></p>

      <div class="account-card glass">
        <h4>Cambia password</h4>
        <div class="account-msg" id="pw-msg"></div>
        <form id="password-form">
          <div class="field">
            <label for="current-password">Password attuale</label>
            <input type="password" id="current-password" autocomplete="current-password" required>
          </div>
          <div class="field">
            <label for="new-password">Nuova password</label>
            <input type="password" id="new-password" autocomplete="new-password" required minlength="6">
          </div>
          <button type="submit" class="btn-primary" id="change-password-btn">Aggiorna password</button>
        </form>
      </div>

      <button class="account-action" id="signout-btn">Esci</button>
      <button class="account-action danger" id="delete-account-btn">Elimina account</button>
    </div>
  </div>

</div>

<!-- Version history sheet -->
<div class="sheet-backdrop" id="version-backdrop">
  <div class="sheet">
    <h3>Cronologia versioni</h3>
    <div id="version-list"></div>
    <button class="sheet-close" id="version-close">Chiudi</button>
  </div>
</div>

<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
