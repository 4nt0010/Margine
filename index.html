<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Margine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #16161B;
    --bg-elevated: #1E1E26;
    --bg-elevated-2: #26262F;
    --ink: #F3EFE6;
    --ink-dim: #9A968C;
    --ink-faint: #6B6862;
    --border: #33333D;

    --card-mustard: #E7B44A;
    --card-teal: #5C9186;
    --card-rose: #D98098;
    --card-denim: #6C8FB8;
    --card-plum: #9A7CAE;

    --ink-on-card: #1B1710;

    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;

    --radius-card: 20px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    height: 100%;
    -webkit-font-smoothing: antialiased;
  }

  body { min-height: 100vh; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }

  input, textarea {
    font-family: inherit;
    color: inherit;
    background: none;
    border: none;
    outline: none;
  }

  ::selection { background: var(--card-mustard); color: var(--ink-on-card); }

  a { color: inherit; }

  /* ---------- Layout shells ---------- */

  #app {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    position: relative;
  }

  .view {
    position: absolute;
    inset: 0;
    display: none;
  }
  .view.active { display: flex; flex-direction: column; }

  /* ---------- Auth view ---------- */

  #auth-view {
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .auth-box {
    width: 100%;
    max-width: 360px;
    text-align: left;
  }

  .auth-wordmark {
    font-family: var(--font-display);
    font-size: 42px;
    font-weight: 500;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .auth-tag {
    color: var(--ink-dim);
    font-size: 14px;
    margin: 0 0 32px;
  }

  .field {
    margin-bottom: 14px;
  }

  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 15px;
  }

  .field input:focus {
    border-color: var(--ink-faint);
  }

  .btn-primary {
    width: 100%;
    background: var(--card-mustard);
    color: var(--ink-on-card);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    font-size: 15px;
    font-weight: 600;
    margin-top: 6px;
  }

  .btn-primary:active { transform: scale(0.99); }

  .auth-switch {
    margin-top: 18px;
    font-size: 13.5px;
    color: var(--ink-dim);
  }

  .auth-switch button {
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .auth-error {
    color: var(--card-rose);
    font-size: 13px;
    margin: -4px 0 14px;
    min-height: 1em;
  }

  /* ---------- List view ---------- */

  #list-view { padding: 0; }

  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 24px 14px;
    flex-shrink: 0;
  }

  .list-wordmark {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 500;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--bg-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-dim);
    flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--ink); background: var(--bg-elevated-2); }
  .icon-btn svg { width: 17px; height: 17px; }

  .search-row {
    padding: 0 24px 16px;
    flex-shrink: 0;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--bg-elevated);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
  }
  .search-box svg { width: 15px; height: 15px; color: var(--ink-faint); flex-shrink: 0; }
  .search-box input { flex: 1; font-size: 14.5px; }
  .search-box input::placeholder { color: var(--ink-faint); }

  .chips-row {
    display: flex;
    gap: 8px;
    padding: 0 24px 18px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  .chips-row::-webkit-scrollbar { display: none; }

  .chip {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .chip.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
    font-weight: 600;
  }

  .cards-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 4px 24px 100px;
  }

  .cards-grid {
    columns: 2;
    column-gap: 12px;
  }
  @media (min-width: 640px) { .cards-grid { columns: 3; } }
  @media (min-width: 960px) { .cards-grid { columns: 4; } }

  .note-card {
    break-inside: avoid;
    margin-bottom: 12px;
    border-radius: var(--radius-card);
    padding: 18px 16px;
    color: var(--ink-on-card);
    display: block;
    width: 100%;
    text-align: left;
    position: relative;
    min-height: 108px;
  }
  .note-card:active { transform: scale(0.98); }

  .note-card .card-subject {
    font-size: 11.5px;
    font-weight: 600;
    opacity: 0.68;
    margin-bottom: 8px;
  }

  .note-card .card-title {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.18;
    margin-bottom: 8px;
  }

  .note-card .card-excerpt {
    font-size: 12.5px;
    line-height: 1.4;
    opacity: 0.72;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .note-card .card-date {
    font-size: 11px;
    opacity: 0.6;
    margin-top: 10px;
  }

  .empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-faint);
  }
  .empty-state p { font-size: 14px; max-width: 240px; margin: 8px auto 0; }

  .fab {
    position: absolute;
    right: 24px;
    bottom: 28px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--card-mustard);
    color: var(--ink-on-card);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .fab:active { transform: scale(0.95); }
  .fab svg { width: 24px; height: 24px; }

  /* ---------- Editor view ---------- */

  #editor-view { background: var(--bg); }

  .editor-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }

  .editor-topbar-right { display: flex; gap: 8px; align-items: center; }

  .save-indicator {
    font-size: 12px;
    color: var(--ink-faint);
    margin-right: 4px;
    min-width: 70px;
  }

  .color-dots { display: flex; gap: 7px; padding: 0 18px; margin: 14px 0 0; }
  .color-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid transparent;
  }
  .color-dot.active { border-color: var(--ink); }

  .editor-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 18px 22px 140px;
  }

  .subject-input {
    font-size: 13px;
    color: var(--ink-dim);
    font-weight: 500;
    width: 100%;
    margin-bottom: 6px;
  }
  .subject-input::placeholder { color: var(--ink-faint); }

  .title-input {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 500;
    line-height: 1.15;
    width: 100%;
    resize: none;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .title-input::placeholder { color: var(--ink-faint); }

  #body-editor {
    font-size: 16px;
    line-height: 1.6;
    outline: none;
    min-height: 200px;
  }
  #body-editor:empty::before {
    content: attr(data-placeholder);
    color: var(--ink-faint);
  }
  #body-editor p {
    margin: 0 0 14px;
    text-align: justify;
  }
  #body-editor .block-heading {
    font-weight: 600;
    font-size: 15px;
    margin: 22px 0 8px;
    color: var(--ink);
  }
  #body-editor ul {
    margin: 0 0 14px;
    padding-left: 22px;
  }
  #body-editor li {
    margin-bottom: 5px;
  }
  #body-editor strong { font-weight: 600; }
  #body-editor em { font-style: italic; }

  .editor-toolbar {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    background: var(--bg-elevated-2);
    padding: 6px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .editor-toolbar .icon-btn { background: none; width: 40px; height: 40px; }
  .editor-toolbar .icon-btn:hover { background: rgba(255,255,255,0.06); }

  /* ---------- Version panel ---------- */

  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: flex-end;
    z-index: 50;
  }
  .sheet-backdrop.active { display: flex; }

  .sheet {
    background: var(--bg-elevated);
    width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 20px 20px 28px;
    max-height: 70vh;
    overflow-y: auto;
  }

  .sheet h3 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 20px;
    margin: 0 0 16px;
  }

  .version-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 4px;
    border-bottom: 1px solid var(--border);
  }
  .version-item:last-child { border-bottom: none; }

  .version-item .v-label { font-size: 14.5px; }
  .version-item .v-sub { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }

  .version-restore {
    font-size: 13px;
    font-weight: 600;
    color: var(--card-mustard);
    padding: 6px 12px;
  }

  .sheet-close {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px;
    margin-top: 8px;
    color: var(--ink-dim);
    font-size: 14px;
  }

  /* ---------- Toast ---------- */

  #toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Print ---------- */

  #print-area { display: none; }

  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area {
      display: block !important;
      position: absolute;
      left: 0; top: 0;
      width: 100%;
      padding: 20mm 18mm;
      color: #111;
      background: #fff;
    }
    #print-area .p-subject {
      font-family: var(--font-body);
      font-size: 11pt;
      color: #666;
      margin-bottom: 4pt;
    }
    #print-area .p-title {
      font-family: var(--font-display);
      font-size: 26pt;
      font-weight: 500;
      margin-bottom: 4pt;
    }
    #print-area .p-date {
      font-family: var(--font-body);
      font-size: 9.5pt;
      color: #888;
      margin-bottom: 22pt;
    }
    #print-area .p-body {
      font-family: var(--font-body);
      font-size: 11.5pt;
      line-height: 1.55;
      color: #1a1a1a;
    }
    #print-area .p-body p { margin: 0 0 10pt; text-align: justify; }
    #print-area .p-body .block-heading {
      font-weight: 600;
      font-size: 12.5pt;
      margin: 16pt 0 6pt;
    }
    #print-area .p-body ul { margin: 0 0 10pt; padding-left: 18pt; }
    #print-area .p-body li { margin-bottom: 3pt; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- AUTH -->
  <div id="auth-view" class="view active">
    <div class="auth-box">
      <p class="auth-wordmark">Margine</p>
      <p class="auth-tag" id="auth-tagline">Accedi per ritrovare i tuoi appunti su ogni dispositivo.</p>

      <div class="auth-error" id="auth-error"></div>

      <form id="auth-form">
        <div class="field">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" autocomplete="current-password" required minlength="6">
        </div>
        <button type="submit" class="btn-primary" id="auth-submit">Accedi</button>
      </form>

      <p class="auth-switch">
        <span id="auth-switch-text">Non hai un account?</span>
        <button type="button" id="auth-switch-btn">Registrati</button>
      </p>
    </div>
  </div>

  <!-- LIST -->
  <div id="list-view" class="view">
    <div class="list-header">
      <p class="list-wordmark">Margine</p>
      <div class="header-right">
        <button class="icon-btn" id="logout-btn" title="Esci">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>

    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Cerca per titolo o materia">
      </div>
    </div>

    <div class="chips-row" id="chips-row">
      <button class="chip active" data-subject="">Tutti</button>
    </div>

    <div class="cards-scroll">
      <div class="cards-grid" id="cards-grid"></div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <p>Ancora nessun appunto. Tocca + per iniziare la prima lezione.</p>
      </div>
    </div>

    <button class="fab" id="new-note-btn" title="Nuovo appunto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <!-- EDITOR -->
  <div id="editor-view" class="view">
    <div class="editor-topbar">
      <button class="icon-btn" id="back-btn" title="Indietro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="editor-topbar-right">
        <span class="save-indicator" id="save-indicator"></span>
        <button class="icon-btn" id="history-btn" title="Cronologia versioni">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button class="icon-btn" id="print-btn" title="Stampa / Esporta PDF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>
        <button class="icon-btn" id="delete-btn" title="Elimina">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>
    </div>

    <div class="color-dots" id="color-dots"></div>

    <div class="editor-scroll">
      <input type="text" class="subject-input" id="subject-input" placeholder="Materia (facoltativo)">
      <textarea class="title-input" id="title-input" placeholder="Titolo della lezione" rows="1"></textarea>
      <div id="body-editor" contenteditable="true" data-placeholder="Scrivi qui. Vai a capo per formattare: “- ” per gli elenchi, una riga breve che finisce con “:” per i sotto-titoli, **grassetto** e *corsivo*."></div>
    </div>

    <div class="editor-toolbar">
      <button class="icon-btn" id="bold-btn" title="Grassetto"><strong style="font-family: var(--font-display); font-size:16px;">B</strong></button>
      <button class="icon-btn" id="italic-btn" title="Corsivo"><em style="font-family: var(--font-display); font-size:16px;">i</em></button>
      <button class="icon-btn" id="list-btn" title="Elenco puntato">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      </button>
    </div>
  </div>

</div>

<!-- Version history sheet -->
<div class="sheet-backdrop" id="version-backdrop">
  <div class="sheet">
    <h3>Cronologia versioni</h3>
    <div id="version-list"></div>
    <button class="sheet-close" id="version-close">Chiudi</button>
  </div>
</div>

<div id="toast"></div>

<!-- Hidden print template -->
<div id="print-area">
  <div class="p-subject" id="print-subject"></div>
  <div class="p-title" id="print-title"></div>
  <div class="p-date" id="print-date"></div>
  <div class="p-body" id="print-body"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
